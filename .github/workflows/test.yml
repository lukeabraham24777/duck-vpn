name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m unittest discover -s tests -v
      - name: Build the menu bar app (macOS)
        if: runner.os == 'macOS'
        run: |
          pip install .
          duck-vpn --version
          python -c "from duckvpn import menubar; app = menubar.DuckApp(); app.refresh(); print([str(k) for k in app.menu])"
