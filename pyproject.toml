[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "duck-vpn"
version = "0.1.0"
description = "Find a free VPN Gate server in another country that gets past geo-blocks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    # Menu bar app (macOS only).
    "rumps>=0.4.0; sys_platform == 'darwin'",
]

[project.scripts]
duck-vpn = "duckvpn.cli:main"

[tool.setuptools]
packages = ["duckvpn"]

[tool.setuptools.package-data]
duckvpn = ["assets/*"]
