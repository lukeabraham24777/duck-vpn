[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "duck-vpn"
version = "0.1.0"
description = "Find a free VPN Gate server in another country that gets past geo-blocks"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
duck = "duckvpn.cli:main"

[tool.setuptools]
packages = ["duckvpn"]
